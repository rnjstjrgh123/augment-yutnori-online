<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>증강 윷놀이 온라인</title>
<style>
:root{--gold:#e6c27d;--panel:#202936;--line:#63523a;--muted:#bac4d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#35414d,#141922 65%);color:#f8f0df;font-family:system-ui,"Malgun Gothic",sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;background:#111720dd;border-bottom:1px solid #57472f}h1{font-size:clamp(20px,3vw,30px);color:var(--gold);margin:0}main{max-width:1150px;margin:auto;padding:18px}.panel{background:linear-gradient(145deg,#26313f,#171e28);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#d6c7a7;margin-bottom:5px}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #66717e}input,select{width:100%;background:#111923;color:#fff}button{cursor:pointer;background:linear-gradient(#3b4654,#222b37);color:#fff3d9}button.primary{background:linear-gradient(#e6c58b,#9b7139);color:#20170c;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}button,input,select{touch-action:manipulation}button{min-height:44px}body{padding-bottom:env(safe-area-inset-bottom)}header{padding-top:max(14px,env(safe-area-inset-top))}.board{touch-action:pan-y;aspect-ratio:1/1}@media(max-width:520px){main{padding:8px}header{padding-left:12px;padding-right:12px}.panel{padding:12px}.gamegrid{gap:8px}.board{border-width:4px}.choices button{min-width:calc(50% - 8px);font-size:14px}.room,.member{align-items:flex-start;flex-wrap:wrap}}.hidden{display:none!important}.muted,.note{color:var(--muted);font-size:13px;line-height:1.5}.rooms{display:grid;gap:8px}.room,.member{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #46515f;border-radius:10px;background:#111923}.screen{display:none}.screen.show{display:block}.board{width:100%;max-width:700px;display:block;margin:auto;background:#b98b51;border:8px solid #76572e;border-radius:16px}.gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.log{max-height:170px;overflow:auto;font-size:13px}.log div{padding:4px 0;border-bottom:1px solid #ffffff0d}.pill{border:1px solid #806c4b;border-radius:20px;padding:3px 9px;font-size:12px;color:#f3d7a1}.toast{padding:10px;background:#3b2c19;border:1px solid #967545;border-radius:8px;margin-bottom:12px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{flex:1;min-width:90px}.turn{background:#111923;padding:10px;border-radius:9px;margin-bottom:10px}@media(max-width:800px){.grid,.gamegrid{grid-template-columns:1fr}}@media(max-width:520px){main{padding:10px}header{padding:12px}}
</style></head><body>
<header><div><h1>✦ 증강 윷놀이</h1><div class="muted">온라인 멀티플레이 개발 버전</div></div><div class="row" style="flex:0 1 auto"><button id="home">로비</button><span id="conn" class="pill">연결 중…</span></div></header>
<main>
<section id="lobby" class="screen show"><div class="grid">
<div class="panel"><h2>온라인 로비</h2><p class="note">같은 서버 주소로 접속한 플레이어끼리 방을 만들고 참가할 수 있습니다.</p>
<div class="field"><label>내 닉네임</label><input id="nickname" maxlength="24" value="플레이어"></div>
<div class="row"><button id="showCreate" class="primary">＋ 방 만들기</button><button id="refresh">방 목록 새로고침</button></div>
<div id="createForm" class="hidden"><hr><h3>방 설정</h3><div class="field"><label>방 이름</label><input id="roomName" value="새 윷놀이 방" maxlength="24"></div>
<div class="row"><div class="field"><label>모드</label><select id="mode"><option value="solo">개인전</option><option value="team">팀전 (기본 대기실 지원)</option></select></div><div class="field"><label>최대 인원</label><select id="maxPlayers"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div>
<div class="row"><div class="field"><label>플레이어당 말</label><select id="pieceCount"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div class="field"><label>공개 여부</label><select id="privacy"><option value="public">공개</option><option value="private">비공개</option></select></div></div>
<div class="field"><label>비밀번호 (선택)</label><input id="password" type="password" placeholder="비워 두면 비밀번호 없음"></div><button id="create" class="primary">방 생성</button></div>
</div><div class="panel"><h2>열린 방</h2><div id="rooms" class="rooms"><p class="note">방 목록을 불러오는 중…</p></div></div>
</div></section>
<section id="waiting" class="screen"><div class="panel"><div class="row" style="align-items:center"><div><h2 id="waitTitle">대기실</h2><div id="waitMeta" class="muted"></div></div><button id="leave">방 나가기</button></div><div class="grid" style="margin-top:14px"><div class="panel"><h3>참가자</h3><div id="members" class="rooms"></div></div><div class="panel"><h3>방 설정</h3><div id="settings" class="turn"></div><p id="waitNote" class="note"></p><div class="row"><button id="ready">준비 완료</button><button id="start" class="primary">게임 시작</button></div></div></div></div></section>
<section id="game" class="screen"><div id="gameToast" class="toast hidden"></div><div class="gamegrid"><div class="panel"><h2>윷놀이 판</h2><p class="note">윷 결과를 먼저 선택한 다음, 오른쪽의 말 버튼을 눌러 출발/이동하세요. 윷·모가 나오면 같은 플레이어가 추가로 던집니다.</p><svg id="board" class="board" viewBox="0 0 600 600" aria-label="윷놀이 말판"></svg></div><div><div class="panel"><h2>게임 진행</h2><div id="turn" class="turn"></div><button id="roll" class="primary" style="width:100%">윷 던지기</button><div id="results" class="choices" style="margin-top:10px"></div><div id="moves" class="choices" style="margin-top:10px"></div><button id="endTurn" style="width:100%;margin-top:10px">턴 종료</button></div><div class="panel"><h3>참가자</h3><div id="gamePlayers" class="rooms"></div></div><div class="panel"><h3>기록</h3><div id="log" class="log"></div></div></div></div></section>
</main>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io({path:"/socket.io/",timeout:20000,reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:800,reconnectionDelayMax:5000,transports:["polling","websocket"]});const $=id=>document.getElementById(id);let myRoom=null,myState=null,myId=null,isHost=false;
const colors=["#5aa9ff","#ff6868","#65d79a","#ffd064","#c78aff","#ff9d52","#5de0d5","#eee"];
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("show"));$(id).classList.add("show")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function emitAck(event,data){return new Promise(resolve=>socket.emit(event,data||{},resolve))}
socket.on("connect",()=>{$("conn").textContent="서버 연결됨";myId=socket.id;socket.emit("rooms:list:request")});
socket.on("disconnect",()=>{$("conn").textContent="연결 끊김 · 재연결 중…"});socket.on("connect_error",()=>{$("conn").textContent="서버 연결 재시도 중…"});
$("home").onclick=()=>screen("lobby");$("showCreate").onclick=()=>$("createForm").classList.toggle("hidden");$("refresh").onclick=()=>socket.emit("rooms:list:request");
$("create").onclick=async()=>{let r=await emitAck("room:create",{playerName:$("nickname").value,name:$("roomName").value,mode:$("mode").value,maxPlayers:+$("maxPlayers").value,pieceCount:+$("pieceCount").value,privacy:$("privacy").value,password:$("password").value});if(!r.ok)return alert(r.error);enterRoom(r)};
function enterRoom(r){myRoom=r.room;myState=r.state;isHost=myRoom.players.some(p=>p.id===myId&&p.host);renderRoom();screen("waiting")}
socket.on("rooms:list",list=>{let box=$("rooms");box.innerHTML="";if(!list.length){box.innerHTML='<p class="note">현재 공개 방이 없습니다. 새 방을 만들어 보세요.</p>';return}list.forEach(r=>{let d=document.createElement("div");d.className="room";d.innerHTML=`<div><b>${esc(r.name)}</b><br><small>${r.mode==="solo"?"개인전":"팀전"} · ${r.players.length}/${r.maxPlayers}명 · 말 ${r.pieceCount}개 ${r.hasPassword?"🔒":""} · ${r.code}</small></div><button>참가</button>`;d.querySelector("button").onclick=async()=>{let password="";if(r.hasPassword){password=prompt("방 비밀번호")||""}let res=await emitAck("room:join",{roomId:r.id,password,playerName:$("nickname").value});if(!res.ok)alert(res.error);else enterRoom(res)};box.appendChild(d)})});
socket.on("room:update",d=>{if(myRoom&&d.room.id===myRoom.id){myRoom=d.room;myState=d.state;renderRoom();if(myRoom.started&&myState){renderGame();screen("game")}}});
socket.on("game:state",d=>{myRoom=d.room;myState=d.state;renderGame();screen("game")});
socket.on("room:kicked",d=>{alert(d.message);myRoom=null;myState=null;screen("lobby")});
function renderRoom(){if(!myRoom)return;$("waitTitle").textContent=myRoom.name;$("waitMeta").textContent="방 코드: "+myRoom.code+" · "+myRoom.players.length+"/"+myRoom.maxPlayers+"명";$("settings").innerHTML=`모드: ${myRoom.mode==="solo"?"개인전":"팀전"}<br>플레이어당 말: ${myRoom.pieceCount}개<br>공개 여부: ${myRoom.hasPassword?"비밀번호 필요":"공개/비밀번호 없음"}`;$("members").innerHTML="";myRoom.players.forEach(p=>{let d=document.createElement("div");d.className="member";d.innerHTML=`<span>${esc(p.name)} ${p.host?'<span class="pill">방장</span>':""} ${p.ready?'<span class="pill">준비</span>':""}</span>${isHost&&!p.host?'<button>추방</button>':""}`;let b=d.querySelector("button");if(b)b.onclick=async()=>{let res=await emitAck("room:kick",p.id);if(!res.ok)alert(res.error)};$("members").appendChild(d)});let mine=myRoom.players.find(p=>p.id===myId);$("ready").textContent=mine&&mine.ready&&!isHost?"준비 취소":"준비 완료";$("ready").disabled=isHost;$("start").classList.toggle("hidden",!isHost);$("waitNote").textContent=isHost?"방장입니다. 참가자가 모두 준비하면 게임을 시작할 수 있습니다.":"게임을 시작하려면 준비 완료를 눌러 주세요."}
$("ready").onclick=async()=>{let mine=myRoom.players.find(p=>p.id===myId);let res=await emitAck("player:ready",!(mine&&mine.ready));if(!res.ok)alert(res.error)};
$("start").onclick=async()=>{let res=await emitAck("room:start");if(!res.ok)alert(res.error)};
$("leave").onclick=async()=>{await emitAck("room:leave");myRoom=null;myState=null;screen("lobby");socket.emit("rooms:list:request")};
const outer=[{x:70,y:70},{x:162,y:70},{x:254,y:70},{x:346,y:70},{x:438,y:70},{x:530,y:70},{x:530,y:162},{x:530,y:254},{x:530,y:346},{x:530,y:438},{x:530,y:530},{x:438,y:530},{x:346,y:530},{x:254,y:530},{x:162,y:530},{x:70,y:530},{x:70,y:438},{x:70,y:346},{x:70,y:254},{x:70,y:162}];
const diagA=[outer[0],{x:162,y:162},{x:254,y:254},{x:346,y:346},{x:438,y:438},outer[10]];
const diagB=[outer[5],{x:438,y:162},{x:346,y:254},{x:254,y:346},{x:162,y:438},outer[15]];
function drawBoard(){
 const svg=$("board");
 let s='<rect x="8" y="8" width="584" height="584" rx="12" fill="#d4ad70" stroke="#59391e" stroke-width="8"/>';
 const line=pts=>`<polyline points="${pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="#68472b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
 s+=line([...outer,outer[0]])+line(diagA)+line(diagB);
 s+='<circle cx="300" cy="300" r="29" fill="#7fd6c4" stroke="#225e57" stroke-width="5"/><text x="300" y="306" text-anchor="middle" font-size="17" font-weight="900" fill="#163f3a">중앙</text>';
 const cornerIndices=new Set([0,5,10,15]);
 const nodes=[...outer,...diagA.slice(1,-1),...diagB.slice(1,-1)];
 nodes.forEach(pt=>{
   const oi=outer.findIndex(q=>q.x===pt.x&&q.y===pt.y);
   const isCorner=cornerIndices.has(oi);
   const isStart=oi===15;
   const radius=isCorner?19:13;
   const fill=isStart?'#ffcf4a':(isCorner?'#f3d5a0':'#f6e6c4');
   const stroke=isStart?'#a33d19':'#68472b';
   s+=`<circle cx="${pt.x}" cy="${pt.y}" r="${radius}" fill="${fill}" stroke="${stroke}" stroke-width="${isCorner?5:3}"/>`;
   if(isStart) s+=`<circle cx="${pt.x}" cy="${pt.y}" r="7" fill="#e34f32" stroke="#fff2c7" stroke-width="2"/>`;
 });
 svg.innerHTML=s;renderPieces();
}
function renderPieces(){if(!myState)return;let svg=$("board");svg.querySelectorAll(".piece").forEach(n=>n.remove());myState.players.forEach((p,pi)=>p.pieces.forEach((pos,idx)=>{if(pos===null||pos>=19)return;let pt=outer[(15+Math.max(0,pos))%outer.length];let c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",pt.x+(idx%2)*8-4);c.setAttribute("cy",pt.y+Math.floor(idx/2)*8-4);c.setAttribute("r",10);c.setAttribute("fill",p.color);c.setAttribute("stroke","#fff");c.setAttribute("stroke-width",3);c.setAttribute("class","piece");svg.appendChild(c);let stack=p.pieces.filter(x=>x===pos).length;if(stack>1){let t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",pt.x+12);t.setAttribute("y",pt.y-12);t.setAttribute("fill","#fff");t.setAttribute("stroke","#222");t.setAttribute("stroke-width",3);t.setAttribute("paint-order","stroke");t.setAttribute("font-weight","900");t.setAttribute("class","piece");t.textContent="×"+stack;svg.appendChild(t)}}))}
const augmentNames={fortune:"행운의 윷 · 윷/모 확률 증가",capturer:"포획왕 · 말을 잡으면 추가 던지기 2회",guardian:"수호 부적 · 첫 포획 1회 방어",swift:"질주 · 첫 출발 이동에 한 칸 추가"};
function renderGame(){if(!myState)return;drawBoard();let p=myState.players[myState.turnIndex];$("turn").innerHTML=`<b style="color:${p.color}">${esc(p.name)} 차례</b><br>${myState.currentResult?`선택 결과: ${myState.currentResult.name} · 아래에서 이동할 말을 선택하세요`:(myState.extraRolls>0?`추가 던지기 ${myState.extraRolls}회 남음 · 윷을 던지세요.`:"윷을 던지세요.")}${myState.winner?`<br>승자: ${esc(myState.winner)}`:""}`;$("roll").disabled=p.id!==myId||!!myState.currentResult||myState.gameOver;$("endTurn").disabled=p.id!==myId||!!myState.currentResult||myState.pending.length>0||myState.extraRolls>0||myState.gameOver;$("results").innerHTML="";myState.pending.forEach((r,i)=>{let b=document.createElement("button");b.textContent=`${r.name} (${r.value>0?"+":""}${r.value}) 먼저 사용`;b.onclick=async()=>{let x=await emitAck("game:choose-result",i);if(!x.ok)alert(x.error)};$("results").appendChild(b)});$("moves").innerHTML="";if(myState.currentResult&&p.id===myId){p.pieces.forEach((pos,i)=>{if(pos!==null&&pos>=19)return;let b=document.createElement("button");b.textContent=pos===null?`말 ${i+1} 출발점에 놓기`:`말 ${i+1} 이동하기`;b.onclick=async()=>{let x=await emitAck("game:move",i);if(!x.ok)alert(x.error)};$("moves").appendChild(b)})}let players=$("gamePlayers");players.innerHTML="";myState.players.forEach(p=>{let d=document.createElement("div");d.className="member";d.innerHTML=`<span style="color:${p.color}">● ${esc(p.name)}<br><small style="color:#e6c27d">${esc(augmentNames[p.augment]||"증강 없음")}</small></span><span>${p.finished}/${p.pieces.length} 완주</span>`;players.appendChild(d)});$("log").innerHTML=myState.log.map(s=>`<div>${esc(s)}</div>`).join("");if(!myState.gameOver&&p.id===myId&&myState.pending.length===0&&!myState.currentResult){$("gameToast").textContent="현재 차례입니다. 윷을 던지세요.";$("gameToast").classList.remove("hidden")}else $("gameToast").classList.add("hidden")}
$("roll").onclick=async()=>{let r=await emitAck("game:roll");if(!r.ok)alert(r.error)};$("endTurn").onclick=async()=>{let r=await emitAck("game:end-turn");if(!r.ok)alert(r.error)};
</script></body></html>
